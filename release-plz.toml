# release-plz prepares cctop's releases: .github/workflows/release-plz.yml runs
# `release-plz release-pr` on every push to main, which keeps one pull request
# open that bumps whatever main would release. Merging it is the release:
# release.yml sees the new version in Cargo.toml and does the rest.
#
# What it bumps, and why that is the rule:
#
# - A crate whose packaged contents differ from its copy on crates.io — its
#   files, or its manifest as cargo would publish it, so a moved
#   `[workspace.dependencies]` entry or `[workspace.package]` field counts.
#   Compared with crates.io rather than the last tag, which comes to the same
#   thing: every release publishes every crate it bumped.
# - By a patch, or by a 0.x minor (0.35.2 -> 0.36.0) when cargo-semver-checks
#   finds its public API broke. The internal requirements under
#   `[workspace.dependencies]` are carets on the compatible part ("0.35"), so a
#   breaking bump rewrites the requirement and every crate that names it takes
#   a patch with it; a patch rewrites nothing and moves nothing else. `pub` in
#   these crates is for use between them, not a designed API, so expect more
#   breaking bumps than a library would take.
# - The root `cctop` every time anything is released: see its [[package]].
#
# The commit messages decide nothing here. They are not conventional commits,
# and release-plz reads a commit that is not one as a patch.
#
# A release that should be a minor of the root — behaviour changed in existing
# installs — is a version edited by hand on the release branch, just before
# merging; CONTRIBUTING.md says how.

[workspace]
# release.yml tags, writes the GitHub release and publishes to crates.io; it
# did before release-plz and still does, so release-plz must do none of them
# (`release-plz release` is never run, and these keep it inert if it were).
git_tag_enable = false
git_release_enable = false
publish = false
# There are no CHANGELOG.md files: the release notes are one line per merged
# pull request, generated by GitHub, under a paragraph written into the release
# pull request's description.
changelog_update = false
# Only the workspace's own crates in Cargo.lock: a dependency moves in a pull
# request of its own, where it is reviewed and tested, not inside a release.
dependencies_update = false
semver_check = true

# The title is also the release commit's message. It never reaches a release
# note: .github/release.yml leaves out pull requests with this label.
pr_name = "chore: release"
pr_labels = ["release"]
pr_branch_prefix = "release-plz-"
# The first line is the marker release.yml cuts the notes at; keep the two
# spelled the same. A person writes the release's prose above it before
# merging. release-plz rewrites this description whenever main moves, so the
# prose goes in last.
pr_body = """
<!-- The release notes are what is written above this line. -->

---

**Before merging**, write above the line — at the very top of this description — a paragraph saying what this release is for, in the user's terms. It opens the GitHub release, above the list of merged pull requests, and `cctop --update` shows it to everyone who updates. release-plz rewrites this description whenever main moves, so write it last; left empty, the release is the list alone.

{% for release in releases %}{% if release.package == "cctop" %}## cctop {{ release.next_version }}{% endif %}{% endfor %}

{% for release in releases %}
* `{{ release.package }}`: {% if release.previous_version and release.previous_version != release.next_version %}{{ release.previous_version }} -> {% endif %}{{ release.next_version }}{% if release.semver_check == "incompatible" %} (API broke: a breaking bump){% endif %}
{%- endfor %}
{%- for release in releases %}{% if release.breaking_changes %}

<details><summary><code>{{ release.package }}</code>: what cargo-semver-checks found</summary>

```text
{{ release.breaking_changes }}
```
</details>{% endif %}{% endfor %}

To make it a minor of `cctop` (behaviour changed in existing installs), see "Releasing" in CONTRIBUTING.md.
"""

# The release version and the tag. It is released whenever anything is: an
# internal crate on crates.io is only reachable through a `cctop` that
# requires it, and release.yml releases on a change of this version alone.
#
# release-plz's own rules do not promise that when only a crate under crates/
# changed: a core fix that keeps core's API rewrites no requirement, and
# Cargo.lock is compared before the bump. (It bumps the root today all the
# same, because `cargo package --list` at the workspace root lists every
# default member, so the root never looks equal to its published copy — an
# accident, not a rule to rest on.) Taking the internal crates' commits into
# its own history makes it the rule: they are the commits `cctop` is built
# from.
[[package]]
name = "cctop"
changelog_include = ["cctop-core", "cctop-serve", "cctop-tunnel", "cctop-ui"]
