[package]
name = "cctop-serve"
# Its own version, not the release's: bumped only in a release that changes
# this crate. The rules are in tools/release-plan.sh, which CI enforces.
version = "0.30.0"
edition.workspace = true
rust-version.workspace = true
description = "Internal to cctop: the web server. No stable API; use the cctop binary."
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
# No doc comment in cctop is an example meant to run, and without this every
# `cargo test` hands each crate to rustdoc again to find that out.
doctest = false

[features]
# Off by default and never enabled for a release: compiles in `src/debug.rs`,
# which can make the server fail on demand. See CONTRIBUTING.md.
debug = ["cctop-core/debug"]

[dependencies]
cctop-core.workspace = true
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
flate2.workspace = true
libc.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

# The web UI is compressed when this crate is built (`build.rs`), so the
# brotli encoder runs on the build machine and is not linked into cctop.
[build-dependencies]
brotli.workspace = true
flate2.workspace = true

[dev-dependencies]
cctop-core = { workspace = true, features = ["test-support"] }
# The tests decode what the build compressed, byte for byte, and a brotli body
# off the wire. The decoder alone: the encoder is a build dependency only.
brotli-decompressor.workspace = true
# Only for the constant the pinned share page has to agree with: see
# `term::tests::the_pinned_share_page_speaks_the_linked_servers_protocol`.
rmux-server.workspace = true
