    <!-- What the server knows and the page cannot: the token, whether this run
         may act, the operator's home, the version. Not in the page, which is
         the same for every run so cctop can compress it when it is built, but
         asked for here, first thing: the request is in flight while the
         browser parses the app's script, and config.ts waits on it. With the
         `?t=` the page was opened with, ahead of the cookie, so a read-only
         link is told the read-only token even where the full one's cookie is
         held. -->

      } catch (e) {}
