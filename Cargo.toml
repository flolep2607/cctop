# The release version — the binary's, and the tag's — and before anything else
# in the file, because the release workflow reads the first `version` line of
# this file as the version to tag. Only the root `cctop` package inherits it:
# cctop-core, cctop-serve and cctop-ui each carry their own in crates/*/, and a
# release bumps one of those only when that crate changed since the last tag
# (see "Every crate is published" below, and tools/release-plan.sh).
#
# 0.23.0 is cut from the commit that touches this file: the first attempt failed verify, so nothing was tagged.
#
# The commit that bumps a version must bump `Cargo.lock` with it, in the same
# commit, and for an internal crate its `=` requirement under
# `[workspace.dependencies]` too — cargo refuses to resolve the moment one of
# them disagrees, so a forgotten one fails loudly rather than shipping.
# `verify / package` runs `cargo publish --dry-run`, which refuses a dirty tree,
# and cargo rewrites the lock the moment it reads a version that disagrees with
# it — so a bump on its own leaves one file changed and fails the release before
# anything is tagged. 0.26.2 shipped that way once. `tools/bump.sh` makes all of
# these edits, but it is a convenience: by hand it is one `version` line per
# bumped crate, its pin, the root version and the lock.
[workspace.package]
version = "0.29.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/flolep2607/cctop"
homepage = "https://github.com/flolep2607/cctop"

# cctop is one binary built from four crates, cut where the dependencies
# already ran one way, so that an edit recompiles only what sits above it:
#
#                 cctop   main, the command line, and the commands nothing
#               /   |   \  else calls (doctor, why, wait, mcp, recall)
#   cctop-ui        |    cctop-serve
#   the terminal    |    the web server
#   dashboard       |
#               \   |   /
#               cctop-core   sessions and their parsers, the cache, pricing,
#                            config, processes, hooks, rmux, the shim, and
#                            what both faces read and do to a session
#
# - **core / everything else.** Sessions, the parsers and the cache are what
#   every surface reads, and they reach each other in every direction (the
#   loader needs the hooks, the hooks need the sessions), so they stay one
#   crate rather than a cut through a cycle. With them is what the dashboard
#   and the page both show and do — the conversation, the report, the export,
#   the handoff brief, the actions — because both faces use it.
# - **ui and serve side by side.** Neither depends on the other, so an edit to
#   one rebuilds it and the binary and nothing else, and the two compile in
#   parallel after core. The dashboard can still start a server to share its
#   table: the binary, which has both, hands it the function that does.
# - **the binary on top**, holding the command line and the commands nothing
#   else calls, so that changing a flag rebuilds only the binary.
# - **nothing in core reaches up.** What core once borrowed from the faces
#   above it — the git branch of a row, the screen-footer table, the clipboard,
#   the tunnel, the webhook POST — moved down, because each had a user below.
#
# Every crate is published, because `cargo install cctop` builds from
# crates.io and a crates.io package can only depend on others that are there
# too. The internal ones are not meant to be used on their own and promise no
# API between versions; the `=` pins below are what keeps a `cargo install
# cctop@x` from ever pairing it with another version's core.
#
# Each has its own version, and a release bumps (and publishes) only the ones
# that changed since the last tag, plus the root every time. Changed means:
#
#   1. a file under its directory changed;
#   2. its packaged manifest changed without one — a `[workspace.dependencies]`
#      entry it uses, or a `[workspace.package]` field it inherits;
#   3. an internal crate it depends on was bumped. This follows from the `=`
#      pins: a published cctop-ui@0.28.3 requires cctop-core =0.28.3, so a
#      cctop wanting core 0.28.4 beside it would resolve two cores and fail to
#      build. A core change therefore bumps all four.
#
# `verify` enforces this on a release commit (tools/release-plan.sh check), and
# `publish-crate` skips whatever crates.io already has.
[workspace]
members = ["crates/core", "crates/serve", "crates/ui"]
# Everything, so that a bare `cargo test` or `cargo clippy` at the root checks
# what CI checks rather than only the binary.
default-members = [".", "crates/core", "crates/serve", "crates/ui"]
resolver = "3"

[workspace.dependencies]
cctop-core = { path = "crates/core", version = "=0.28.5" }
cctop-serve = { path = "crates/serve", version = "=0.28.5" }
cctop-ui = { path = "crates/ui", version = "=0.28.5" }

anyhow = "1.0.104"
# The pty shim and TIOCSTI injection need libc. It is already in the tree under
# sysinfo, so this adds no dependency.
libc = "0.2.189"
mimalloc = "0.1"
chrono = "0.4.45"
clap = { version = "4.6.5", features = ["derive"] }
# `cctop serve --tunnel` speaks the trycloudflare protocol itself — QUIC to the
# edge — rather than shelling out to `cloudflared` and reading a URL off its
# stderr, so a tunnel needs nothing installed and cctop stays one binary. tokio
# comes with it: the tunnel's data path runs on a two-worker runtime inside this
# process, and nothing else here is async.
cloudflare-quick-tunnel = "0.3.1"
crossterm = "0.29.0"
dirs = "6.0.0"
flate2 = "1.1.9"
# The web UI's fixed bodies are sent brotli to a browser that takes it: the app
# page, rmux's terminal bundle and its WebAssembly come out 7-20% smaller than
# gzip. They are compressed when cctop is built (`crates/serve/build.rs`), so
# this is a build dependency only and the encoder is not in the binary — it was
# about a megabyte of it. Pure Rust; without default features it is the
# encoder, the decoder it is built on, and the two allocator shims they share.
# `ffi-api` for its one non-generic entry point, which is what lets the
# `profile.*.package.brotli` below make the build fast; see the build script.
brotli = { version = "9.0.0", default-features = false, features = ["std", "ffi-api"] }
# The decoder on its own, for the tests that check what the build compressed.
brotli-decompressor = "6.0.1"
notify = { version = "8.2.0", default-features = false }
# The conversation view reads an assistant's replies as the markdown they are
# written in (`ui::markdown`). Only the parser: its defaults are an HTML writer
# and a command-line option parser, neither of which a TUI has use for. What is
# left is pure Rust and brings one crate (`unicase`) the tree did not have.
# `tui-markdown` was the ready-made alternative, and was not taken: it carries
# `rstest` and `pretty_assertions` as ordinary dependencies, highlights code
# through syntect's multi-megabyte syntax dumps, and draws links as text with
# no way to make them OSC 8 — which is why the renderer is cctop's own.
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.37.0", features = ["bundled"] }
self-replace = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order` because cctop rewrites other tools' settings files to add its
# hooks, and a `BTreeMap` behind `Map` would hand the user back every key they
# own sorted alphabetically.
#
# `float_roundtrip` because the default parser is not correctly rounded, and a
# cached cost is an `f64` that goes out to the cache file and comes back.
# Measured here: 29.6% of finite `f64`s failed to survive a round trip through
# serde_json's own output — each landing one ULP away — and with the feature on,
# none do. A cost read back at the wrong bit is not the figure that was
# computed, so a session's total could differ from a fresh parse of the same
# transcript, and the cache never notices because the wrong value is now what
# it stores. It costs about 2% on a float-heavy parse (15.6ms -> 15.9ms for
# 1.3 MB of rate tables), which is startup and paid once.
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
sysinfo = "0.39.6"
# Hashes the binary `--update` downloaded as the user, so the root step that
# installs it can check it is the same file. Already in the tree under the TLS
# stack, so this adds no dependency.
sha2 = "0.10.9"
tar = "0.4.46"
tempfile = "3.27.0"
# How many colours the terminal can show, read from the environment the way
# `TERM`/`COLORTERM`/`FORCE_COLOR` conventions intend, and the 256→16 table the
# palette is folded through when the answer is sixteen (see `ui::theme`).
# `convert` and `ratatui` add nothing new to the tree: anstyle, palette and
# ratatui-core are already here under clap, ratatui-image and ratatui. Left out
# on purpose: `query-detect`, whose DECRQSS probe only tells truecolor from 256
# — a difference cctop never draws — and `terminfo`, which reads a database the
# static musl build cannot count on finding.
termprofile = { version = "0.2.4", default-features = false, features = ["convert", "ratatui"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
toml_edit = "0.25.13"
# The multiplexer, as an API rather than as a command line: `rmux-sdk` talks the
# daemon's typed IPC contract, which is where the operator link of a browser
# share comes back as a field instead of as the stream a URL was printed on.
#
# Its sibling `ratatui-rmux` is deliberately absent. It paints a pane snapshot
# into a ratatui buffer, which cctop does not ask it to do — panes are drawn
# from cctop's own vt100 parser through `tui-term` (see `render::draw_panes`),
# and the crate's one appearance was a test asserting that its widget accepts
# cctop's `Buffer`. That assertion failed against the published crate, because
# 0.10.0 links ratatui 0.29 under the `ratatui-core` name while cctop draws with
# 0.30, so the two `Buffer`s are different types with the same path. The fix is
# Helvesec/rmux#220 — depend on the real `ratatui-core` — and carrying it as a
# `[patch.crates-io]` on a fork blocked every release in the meantime, since
# `cargo publish` ignores a patch and would have shipped a cctop that resolved
# the unfixed crate and failed to build for whoever installed it.
#
# A guard for a use that does not exist is not worth a release that cannot
# happen. When the widget is actually wanted — when a pane is painted from the
# daemon's snapshot rather than from a parser of cctop's own — put back
# `ratatui-rmux = "<the version carrying #220>"` and the test named
# `a_pane_snapshot_paints_into_the_buffer_cctop_draws_with`, which is in this
# repository's history at 3808d80.
rmux-sdk = "0.10.0"
safetensors = "0.6"
# Pure Rust, and deliberately without `onig`: oniguruma is C and `esaxx-rs` is
# C++, and a C++ toolchain is the one dependency class the musl release does not
# already carry. `fancy-regex` is the pure-Rust path through the same crate.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
# The tab bar's attention pulse and restart flash. Only its colour
# interpolation, timers and one-shot effects are used — not the DSL, whose
# parser the bar has no use for. Pure Rust, on the same `ratatui-core` cctop
# draws with, so the musl release takes it as it is.
tachyonfx = { version = "0.25.2", default-features = false, features = ["std"] }
tui-term = "0.3.4"
# The input boxes' editor (`ui::line_edit`) steps its cursor by grapheme and
# measures its columns the way the terminal will draw them. Both crates are
# already in the tree under ratatui, at these versions, so this adds nothing.
unicode-segmentation = "1.13"
unicode-width = "0.2"
# A QR code of a link meant for a phone, drawn in half-blocks inside the panel
# that hands the link out (`ui::qr`). `qrcode` is the encoder the widget takes;
# its default features are image rendering, which a terminal has no use for.
# The widget also drags in `color-eyre` — a normal dependency though only its
# example uses it. Pure Rust all the way down, so the musl builds are unmoved.
qrcode = { version = "0.14", default-features = false }
tui-qrcode = "0.2.6"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
vt100 = "0.16.2"
# The corner preview of a pasted image. Only its halfblocks are used — sixel
# and kitty are escape sequences written around ratatui's buffer rather than
# cells inside it, and a paste confirmation has to survive tmux and ssh, which
# is exactly where those protocols do not. Default features are off because
# `chafa-dyn` needs the C chafa library at build time, which the musl release
# has no toolchain for, and `image-defaults` pulls every codec `image` has.
ratatui-image = { version = "11.0.8", default-features = false }
# Decodes the image a paste files into the DynamicImage ratatui-image takes —
# the same set the sniff accepts (clipboard::format_of): a JPEG or WebP that
# could not preview would still paste, but the toast would go silently missing.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# Decodes the station the rave plays (crates/ui/src/rave/sound.rs). Pure Rust, so it
# links into the static musl build where an audio crate tied to the system's
# sound library could not; MP3 alone, because that is all the stream is.
symphonia = { version = "0.6.1", default-features = false, features = ["mp3"] }
# Whole-screen snapshots of the TUI (`cctop_ui::snapshot`). The `.snap` files are
# committed, so CI compares against them and needs no insta CLI; CLAUDE.md
# says how to accept a change.
insta = "1.48.0"

[package]
name = "cctop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "An htop-like terminal monitor for AI coding agent sessions on Linux (Claude Code, Codex, Cursor, Devin, Gemini CLI, OpenCode, Pi, Windsurf)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
# crates.io accepts at most five — "monitoring" is in the description already.
keywords = ["tui", "claude", "codex", "devin", "htop"]
categories = ["command-line-utilities", "development-tools"]
# /docs/harnesses is 14 MB of other people's documentation against a 10 MB
# crate limit. /docs/rmux is a fifth of a megabyte and could ship, but it is a
# mirror on the same terms and belongs on the same side of the line.
# /RnD is working notes — research, ideas and dead ends. It is for people
# reading this repository, on the same terms as the mirrors above.
# /crates are the other packages of this workspace, each published on its own
# (cargo leaves them out anyway; listed so the reason is written down).
exclude = ["/.github", "/target", "/crates", "/docs/harnesses", "/docs/rmux", "/RnD", "/vendor", "/web"]

# Off by default and never enabled for a release: `debug` compiles in
# `crates/serve/src/debug.rs`, which can make the server fail on demand. Handy
# against a fixture (`cargo run --features debug -- serve`), and not something
# to ship — a build without it contains neither the routes nor the strings that
# name them.
[features]
debug = ["cctop-serve/debug"]

# `cargo binstall cctop` fetches the release archive instead of compiling. Its
# default guesses would find these names too, but only after probing a dozen
# URLs that 404; spelled out, it asks once. Only musl archives are built, and
# binstall already falls back from a gnu host to the musl target on its own.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
cctop-core.workspace = true
cctop-serve.workspace = true
cctop-ui.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
crossterm.workspace = true
libc.workspace = true
mimalloc.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Core's test-only guards — no bell, no clipboard, no write to the real
# preferences — for this crate's tests as for core's own. See its `test-support`.
cctop-core = { workspace = true, features = ["test-support"] }

[profile.release]
# A monitoring tool is launched often and lives in the terminal; a smaller,
# faster binary is worth the extra link time on release builds only.
lto = true
codegen-units = 1
strip = true

# Full debug info is mostly link time and disk for a debugger nobody attached.
# Line tables keep panic backtraces useful; `--profile debugging` restores the
# rest when someone does want to step through. Per the Cargo book's
# build-performance guide.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

# The brotli encoder runs in `crates/serve/build.rs`, and build dependencies
# are compiled unoptimised: there it took 25 s to compress the web UI, on every
# clean build. Optimising this one crate brings that to about 2 s, without
# optimising every other build script and proc macro, which a `build-override`
# would. It is only a build dependency, so nothing in the binary changes.
[profile.dev.package.brotli]
opt-level = 3

[profile.release.package.brotli]
opt-level = 3

# The quick-tunnel client, patched to carry WebSockets. Cloudflare's edge
# strips `Upgrade`/`Connection` and marks the stream a WebSocket instead;
# 0.3.1 never reads that mark, so it dialled the origin with a plain GET and an
# rmux share through the tunnel came back 404. vendor/cloudflare-quick-tunnel
# is 0.3.1 with the headers put back (search it for "cctop patch"), to drop
# once upstream carries the same fix.
#
# A [patch] applies to builds of this repository — CI, the release binaries —
# and not to `cargo install cctop` from crates.io, which resolves the published
# 0.3.1. That matters: every terminal share leaves the machine through this
# client now (`rmux::share_link_with`), so a crates.io build hands out share
# links whose socket is refused at the tunnel — the page loads, the terminal
# never connects. Loopback shares and the release binaries are unaffected.
# Drop the patch, and that caveat, once upstream publishes the fix.
[patch.crates-io]
cloudflare-quick-tunnel = { path = "vendor/cloudflare-quick-tunnel" }
