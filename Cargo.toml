[package]
name = "cctop"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "An htop-like terminal monitor for AI coding agent sessions (Claude Code, Codex)"
authors = ["Florian Leprat <florian.leprat@xtracta.com>"]
license = "MIT"
repository = "https://github.com/flolep2607/cctop"
homepage = "https://github.com/flolep2607/cctop"
readme = "README.md"
keywords = ["tui", "monitoring", "claude", "codex", "htop"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/target"]

[profile.release]
# A monitoring tool is launched often and lives in the terminal; a smaller,
# faster binary is worth the extra link time on release builds only.
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.5", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
ratatui = "0.30.2"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
