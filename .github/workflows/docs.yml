# Publishes README.md and docs/ as flolep2607.github.io/cctop. The pages are
# assembled by book/build.py; see it for why they are copied, not moved.
name: docs

on:
  push:
    branches: [main]
    paths: [README.md, CONTRIBUTING.md, "docs/**", "book/**", .github/workflows/docs.yml]
  pull_request:
    paths: [README.md, CONTRIBUTING.md, "docs/**", "book/**", .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.5.4
    steps:
      - uses: actions/checkout@v6
      - name: Install mdbook
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: book/build.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: book/out

  # A pull request only proves the site builds; main publishes it.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
