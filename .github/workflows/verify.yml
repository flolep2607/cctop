name: Verify

# The checks that decide whether a commit is releasable. Called by CI on every
# push and pull request, and by Release before it tags anything, so a release
# cannot ship code that CI would have rejected.
on:
  workflow_call:
    inputs:
      ref:
        description: "Ref to check out; defaults to the triggering commit"
        type: string
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# kache sits in front of rustc as RUSTC_WRAPPER and restores each crate's
# compiled output by content hash, so a dependency that has not changed is never
# compiled again. It replaced rust-cache, which saved the whole target/ keyed on
# Cargo.lock and so started from scratch whenever one dependency moved.
#
# Each job gets its own cache key: they share a Cargo.lock, so one key would let
# whichever job finished first save and the other two never would — and test,
# clippy and `cargo package` compile with different flags and want different
# artifacts. pr-comment is off because the stats are in each job's summary
# already, and a sticky comment per job would be three of them.
#
# runtime-dir is named only so that the post step stops logging "daemon
# connection timed out". With no S3 remote the action starts no daemon, but a
# runtime directory it chose itself it also cleans up, and it stops the daemon
# first whether one is running or not (kache-action#39). Naming the directory
# makes it ours, so the action neither stops nor removes anything; under
# runner.temp the runner clears it after the job. `warm` would not help: it is
# only read when S3 is configured. The "no S3 remote configured" warning stays.
# The action prints it whenever it falls back to the Actions cache, and that
# cache is the one this project uses.
jobs:
  # cctop is Linux-only: it reads process tables, ptys and unix sockets that
  # only Linux gives it, so Linux is the one platform to build and test on.
  #
  # The runner image is pinned for the reason the toolchain is pinned in
  # rust-toolchain.toml: `ubuntu-latest` moves to a new Ubuntu on GitHub's
  # schedule, and a new OS should arrive in a pull request that changes this
  # line, not as a surprise. Release builds static musl binaries, so the image
  # is only the build environment, never what users run.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - run: rustup toolchain install
      - uses: kunobi-ninja/kache-action@v1
        with:
          cache-key-prefix: kache-test
          pr-comment: false
          runtime-dir: ${{ runner.temp }}/kache
      # The whole workspace: the binary at the root and cctop-core, -serve and
      # -ui under crates/, each with its own tests.
      - run: cargo test --workspace --all-targets
      # The `debug` feature is off by default and never enabled for a release,
      # so nothing above compiles `crates/serve/src/debug.rs`. Without this, a change to
      # `crates/serve/src/lib.rs` that breaks the debug routes is green and nobody
      # finds out until someone runs it by hand.
      - run: cargo test --workspace --all-targets --features debug

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      # The version, clippy and rustfmt all come from rust-toolchain.toml,
      # so CI lints with exactly the Rust a contributor has locally.
      - run: rustup toolchain install
      - uses: kunobi-ninja/kache-action@v1
        with:
          cache-key-prefix: kache-lint
          pr-comment: false
          runtime-dir: ${{ runner.temp }}/kache
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      # As in `test`: the debug routes are behind a feature nothing else builds,
      # so the ordinary clippy run never looks at them.
      - run: cargo clippy --workspace --all-targets --features debug

  # Fails the build if the README or a Cargo.toml would stop `cargo publish`
  # working — cheaper to catch here than at release time. Every crate of the
  # workspace, because the binary can only be installed from crates.io if the
  # crates it is built from are there too; `--workspace` packages them in
  # dependency order against a local copy of the ones not yet published.
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - run: rustup toolchain install
      - uses: kunobi-ninja/kache-action@v1
        with:
          cache-key-prefix: kache-package
          pr-comment: false
          runtime-dir: ${{ runner.temp }}/kache
      - run: cargo publish --dry-run --workspace

  # The web UI's built page is committed (crates/serve/src/assets/app/index.html) so
  # that `cargo install` needs no Node. This rebuilds it from web/ and fails if
  # the result differs: a change to web/ without `npm run build`, or a build
  # edited by hand, is caught here rather than shipped.
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: The committed build matches web/
        run: git diff --exit-code --stat -- crates/serve/src/assets/app/
