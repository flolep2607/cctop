name: Release

# Changing the package version on main cuts a release. The workflow derives a
# `v<version>` tag from Cargo.toml, then builds the tagged commit, attaches the
# archives and checksums, and publishes the crate. Existing tags can still be
# released manually, but they must agree with Cargo.toml.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach binaries to (e.g. v0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Tagging is irreversible and publishing to crates.io cannot be undone, so the
  # full check has to pass before `prepare-release` creates the tag. CI runs
  # these same checks independently; releasing must not depend on that run.
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ inputs.tag || '' }}

  prepare-release:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - id: version
        name: Derive and validate release tag
        run: |
          crate_tag="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="$crate_tag"
          fi

          echo "tag=$tag  Cargo.toml=$crate_tag"
          if [ "$tag" != "$crate_tag" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $crate_tag"
            exit 1
          fi

          # A version change on main owns its tag. Refuse to republish or move
          # an existing tag, and otherwise tag this exact checked-out commit.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            if git rev-parse --verify --quiet "refs/tags/$tag"; then
              echo "::error::release tag $tag already exists; bump Cargo.toml before releasing"
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$tag" --message "Release $tag"
            git push origin "refs/tags/$tag"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  create-release:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          # The notes below are read out of a commit that this one merged, which
          # a shallow checkout does not have.
          fetch-depth: 0
      # Generated notes are one line per merged pull request: a fine index and a
      # poor summary — and `cctop --update` prints these to whoever updates. The
      # release commit already says why the digit moved, in prose, and that was
      # being thrown away.
      - id: notes
        name: Take the release commit's own prose as the notes
        # Through the environment rather than interpolated into the script: a
        # `${{ }}` expression is pasted in as text before bash parses the line,
        # so a Cargo.toml version carrying shell syntax would be run rather than
        # read. As a variable it is only ever data.
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          # The tag lands on a merge commit whose message is GitHub's, so the
          # prose is in the `chore: release` commit underneath it. `--no-merges`
          # matters: a merge commit repeats the branch's subject in its own body,
          # so without it the newest match is the merge and the whole body is one
          # line reading "chore: release X.Y.Z".
          #
          # The version is in the pattern because a search for any release commit
          # walks past a release whose commit was titled differently and happily
          # publishes the previous version's prose: v0.14.0, titled "Release
          # 0.14.0", shipped v0.13.0's notes to everyone who updated. Matching
          # this version alone turns that into a thinner note rather than a wrong
          # one. Both ends are anchored and the dots escaped, so 0.1.0 is not
          # answered by 0.1.0-beta or 10.1.0.
          version="${RELEASE_TAG#v}"
          pattern="^chore: release $(printf '%s' "$version" | sed 's/[.]/\\./g')\$"
          sha="$(git log --no-merges --format=%H --grep="$pattern" -n 1 HEAD || true)"
          body=""
          if [ -n "$sha" ]; then
            body="$(git log --format=%b -n 1 "$sha")"
            # `%b` carries the commit's trailers, and every commit here has a
            # `Co-Authored-By:` one — which was published as the first thing an
            # updater reads. Git decides what the trailer block is: the last
            # paragraph, when `--parse` finds trailers in it. It is asked about
            # the whole message (`%B`), because git reads a message's first
            # paragraph as its title and never as trailers — fed `%b` alone, a
            # body that is nothing but `Co-Authored-By:` is that title, and
            # 0.17.0 went out reading exactly that line. `--no-divider` because
            # this is a commit and not a patch: a markdown `---` in the prose is
            # not where the message ends.
            #
            # Within that block every `Token: value` line and its folded
            # continuations go, not only a known list of attribution names;
            # prose sharing the paragraph stays. ponytail: a closing paragraph
            # that happens to read `Note: ...` is a trailer to git, and goes
            # with them. A body with nothing left contributes nothing, and the
            # release is the generated list alone.
            if [ -n "$(git log --format=%B -n 1 "$sha" | git interpret-trailers --parse --no-divider)" ]; then
              body="$(printf '%s\n' "$body" | awk '
                { line[NR] = $0 }
                END {
                  last = NR
                  while (last > 0 && line[last] ~ /^[[:space:]]*$/) last--
                  start = last
                  while (start > 1 && line[start - 1] !~ /^[[:space:]]*$/) start--
                  for (i = start; i <= last; i++) {
                    if (line[i] ~ /^[A-Za-z0-9-]+[[:space:]]*:/) cut = 1
                    else if (line[i] !~ /^[[:space:]]/) cut = 0
                    drop[i] = cut
                  }
                  for (i = 1; i <= last; i++) if (!drop[i]) kept[++n] = line[i]
                  while (n > 0 && kept[n] ~ /^[[:space:]]*$/) n--
                  for (i = 1; i <= n; i++) print kept[i]
                }')"
            fi
            echo "notes from $(git log --format='%h %s' -n 1 "$sha")"
          else
            # A warning, not a failure: the tag is pushed by the time this
            # runs, so exiting non-zero would leave a tag with no release at
            # all — worse than a release carrying only the generated list.
            echo "::warning::no commit titled 'chore: release $version' found; publishing the generated notes alone"
          fi
          {
            echo "body<<CCTOP_RELEASE_NOTES"
            printf '%s\n' "$body"
            echo "CCTOP_RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          draft: false
          # GitHub puts the generated notes after this, so a release reads as its
          # own summary followed by the pull requests it was made of. An empty
          # body — a bump with nothing written under it — leaves exactly the
          # generated notes that were here before.
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true

  build:
    needs: [prepare-release, create-release]
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # cctop is Linux-only. Both targets are statically linked against musl,
        # so one archive per architecture runs on any distro, glibc or not.
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Handles cross-compilation setup, archive creation, checksums, and
      # uploading the assets to the release.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: cctop
          target: ${{ matrix.target }}
          archive: $bin-$target
          checksum: sha256
          ref: refs/tags/${{ needs.prepare-release.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not configured"
            exit 1
          fi
          # Every target above has already built successfully. Cargo normally
          # builds the package again before uploading; skip that redundant
          # verification on this fresh runner.
          cargo publish --locked --no-verify
