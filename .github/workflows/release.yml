name: Release

# Changing the package version on main cuts a release. The workflow derives a
# `v<version>` tag from Cargo.toml, then builds the tagged commit, attaches the
# archives and checksums, and publishes the crate. Existing tags can still be
# released manually, but they must agree with Cargo.toml.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach binaries to (e.g. v0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - id: version
        name: Derive and validate release tag
        run: |
          crate_tag="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="$crate_tag"
          fi

          echo "tag=$tag  Cargo.toml=$crate_tag"
          if [ "$tag" != "$crate_tag" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $crate_tag"
            exit 1
          fi

          # A version change on main owns its tag. Refuse to republish or move
          # an existing tag, and otherwise tag this exact checked-out commit.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            if git rev-parse --verify --quiet "refs/tags/$tag"; then
              echo "::error::release tag $tag already exists; bump Cargo.toml before releasing"
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$tag" --message "Release $tag"
            git push origin "refs/tags/$tag"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  create-release:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          draft: false
          generate_release_notes: true

  build:
    needs: create-release
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Statically linked, so it runs on any glibc/musl Linux.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Handles cross-compilation setup, archive creation, checksums, and
      # uploading the assets to the release.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: cctop
          target: ${{ matrix.target }}
          archive: $bin-$target
          checksum: sha256
          ref: refs/tags/${{ needs.prepare-release.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not configured"
            exit 1
          fi
          # Every target above has already built successfully. Cargo normally
          # builds the package again before uploading; skip that redundant
          # verification on this fresh runner.
          cargo publish --locked --no-verify
