name: Release

# Changing the package version on main cuts a release — normally by merging the
# release pull request release-plz.yml keeps open. The workflow derives a
# `v<version>` tag from Cargo.toml, then builds the tagged commit, attaches the
# archives and checksums to a draft release that it publishes only once they are
# all there, and publishes the crates. Existing tags can still be
# released manually, but they must agree with Cargo.toml.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach binaries to (e.g. v0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Tagging is irreversible and publishing to crates.io cannot be undone, so the
  # full check has to pass before `prepare-release` creates the tag. CI's run
  # on the same push is concurrent with this one, so releasing cannot wait on it.
  #
  # Unless it has already passed, on exactly this code. A release is a merged
  # pull request, and CI ran this same verify on that pull request before it
  # could merge. When the branch already contained main, the merge commit holds
  # the very files that run tested, and running it again is three minutes spent
  # proving nothing new. Anything else — a branch behind main, a push straight to
  # main, a tag, a dispatch — gets verify here.
  already-verified:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      verified: ${{ steps.check.outputs.verified }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          verified=false
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref_type }}" = branch ] &&
             head=$(git rev-parse --verify --quiet HEAD^2) &&
             git merge-base --is-ancestor HEAD^1 "$head" &&
             [ "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$head^{tree}")" ]; then
            passed=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&status=success" --jq .total_count) || passed=0
            [ "$passed" -gt 0 ] && verified=true
          fi
          echo "verified=$verified  (pull request head: ${head:-none})"
          echo "verified=$verified" >> "$GITHUB_OUTPUT"

  verify:
    needs: already-verified
    if: needs.already-verified.outputs.verified != 'true'
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ inputs.tag || '' }}

  # `!cancelled()` here and on every job below: GitHub skips a job when any job
  # before it in the chain was skipped, and `verify` is skipped on purpose when
  # the pull request's own run stands for it. `!failure()` keeps what the
  # implicit `success()` meant: nothing runs after a job that failed.
  prepare-release:
    needs: [already-verified, verify]
    if: >-
      !cancelled() && !failure() &&
      (needs.verify.result == 'success' || needs.already-verified.outputs.verified == 'true')
    runs-on: ubuntu-24.04  # pinned on purpose: see verify.yml
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      # "false" when a push to main carries a version that is already released.
      # Every job after this one is gated on it, so such a run ends green with
      # the rest skipped rather than red.
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - id: version
        name: Derive and validate release tag
        run: |
          crate_tag="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="$crate_tag"
          fi

          echo "tag=$tag  Cargo.toml=$crate_tag"
          if [ "$tag" != "$crate_tag" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $crate_tag"
            exit 1
          fi

          # A version change on main owns its tag. Refuse to republish or move
          # an existing tag, and otherwise tag this exact checked-out commit.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
              # Any Cargo.toml edit on main lands here, not only a bump: #188
              # changed the package's `exclude` list and the run went red as if
              # a release had broken. When the existing tag is already in this
              # commit's history, main simply has not moved past that release,
              # so this push is not one: end quietly and let every later job
              # skip. A tag that is *not* in the history was cut from somewhere
              # else, and claiming its version here would publish two different
              # commits under one number, so that stays an error.
              if git merge-base --is-ancestor "refs/tags/$tag" HEAD; then
                echo "::notice::not a release: $tag already exists and is part of this commit's history"
                echo "release=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::release tag $tag already exists on a commit outside main's history; bump Cargo.toml before releasing"
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$tag" --message "Release $tag"
            git push origin "refs/tags/$tag"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  create-release:
    needs: prepare-release
    if: "!cancelled() && !failure() && needs.prepare-release.outputs.release == 'true'"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # To read the description of the release pull request this tag merged.
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
      # Generated notes are one line per merged pull request: a fine index and a
      # poor summary — and `cctop --update` prints these to whoever updates. So
      # a release opens with a paragraph of prose saying what it is for, written
      # by a person into the release pull request's description, above the
      # marker line that release-plz.toml's `pr_body` starts with.
      #
      # It used to be the body of the `chore: release <version>` commit. That
      # commit is release-plz's now, with nothing under its title, and the pull
      # request is where a person looks the release over anyway.
      - id: notes
        name: Take the release pull request's prose as the notes
        # Through the environment rather than interpolated into the script: a
        # `${{ }}` expression is pasted in as text before bash parses the line,
        # so a Cargo.toml version carrying shell syntax would be run rather than
        # read. As a variable it is only ever data.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          # Spelled the same in release-plz.toml's `pr_body`.
          MARKER: "<!-- The release notes are what is written above this line. -->"
        run: |
          # Every failure below is a warning and no prose, never a failed step:
          # the tag is pushed by the time this runs, so exiting non-zero would
          # leave a tag with no release at all — worse than a release carrying
          # only the generated list.
          #
          # The tag is on the merge commit of the release pull request, and
          # GitHub knows which pull request a commit merged. The label tells the
          # release pull request from any other that contains the commit.
          sha=$(git rev-parse "$RELEASE_TAG^{commit}")
          body=""
          if ! prs=$(gh api "repos/$GH_REPO/commits/$sha/pulls"); then
            echo "::warning::could not ask GitHub which pull request $sha merged; publishing the generated notes alone"
          else
            number=$(jq -r '[.[] | select(any(.labels[]; .name == "release"))][0].number // empty' <<<"$prs")
            if [ -z "$number" ]; then
              echo "::warning::$sha merged no pull request labelled 'release'; publishing the generated notes alone"
            else
              # A description edited in the browser has CRLF line ends.
              description=$(jq -r --argjson n "$number" '.[] | select(.number == $n) | .body // ""' <<<"$prs" | tr -d '\r')
              # Only what is above the marker: below it is release-plz's table
              # of versions, written for the reviewer and not for an updater. No
              # marker at all means the description was replaced wholesale, and
              # then nothing in it is known to be prose.
              if grep -qxF -- "$MARKER" <<<"$description"; then
                # Up to the marker, without the blank lines around the prose.
                body=$(awk -v m="$MARKER" '$0 == m { exit } { line[++n] = $0 }
                  END {
                    first = 1
                    while (first <= n && line[first] ~ /^[[:space:]]*$/) first++
                    while (n >= first && line[n] ~ /^[[:space:]]*$/) n--
                    for (i = first; i <= n; i++) print line[i]
                  }' <<<"$description")
                echo "notes from #$number"
              else
                echo "::warning::#$number has no release-notes marker in its description; publishing the generated notes alone"
              fi
            fi
          fi
          {
            echo "body<<CCTOP_RELEASE_NOTES"
            printf '%s\n' "$body"
            echo "CCTOP_RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"
      # A draft, which the releases API does not show as `latest`: every cctop
      # in the world reads that endpoint to decide whether to update, and a
      # published release with no binaries yet sent each of them to download an
      # archive that was not there. v0.31.0 sat like that for seven minutes.
      # `publish` below makes it public once every archive is attached. On a
      # re-run for a release that already exists, the action keeps whatever
      # draft state it has.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          draft: true
          # GitHub puts the generated notes after this, so a release reads as its
          # own summary followed by the pull requests it was made of. An empty
          # body — a bump with nothing written under it — leaves exactly the
          # generated notes that were here before.
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true

  build:
    needs: [prepare-release, create-release]
    if: "!cancelled() && !failure() && needs.prepare-release.outputs.release == 'true'"
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # cctop is Linux-only. Both targets are statically linked against musl,
        # so one archive per architecture runs on any distro, glibc or not.
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      # The same cross toolchains `verify / musl` checks with, so the build runs
      # on this runner's cargo rather than in a container kache cannot reach.
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      # kache, as in verify.yml: rust-cache keyed the whole target/ on
      # Cargo.lock, which every release changes, so each release built every
      # dependency from nothing — eight of a build's nine minutes. kache
      # restores each crate by content hash, so only what changed compiles.
      # Its cache is saved from main, which is where releases run.
      - uses: kunobi-ninja/kache-action@v1
        with:
          cache-key-prefix: kache-release-${{ matrix.target }}
          pr-comment: false
          runtime-dir: ${{ runner.temp }}/kache
      # Handles cross-compilation setup, archive creation, checksums, and
      # uploading the assets to the release.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: cctop
          target: ${{ matrix.target }}
          build-tool: cargo
          archive: $bin-$target
          checksum: sha256
          ref: refs/tags/${{ needs.prepare-release.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # Only once every target's archive and checksum is attached: `build` has
  # `fail-fast: false`, so a target that failed leaves the release a draft for
  # someone to look at rather than public and missing a platform.
  publish:
    needs: [prepare-release, build]
    if: "!cancelled() && !failure() && needs.prepare-release.outputs.release == 'true'"
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
      # Here and not on `release: published`, which a release made public by
      # this workflow's own token does not fire.
      - uses: actions/checkout@v6
      - name: Push the latest release to the updater's mirror
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_MIRROR_TOKEN: ${{ secrets.RELEASE_MIRROR_TOKEN }}
        run: tools/push-release-mirror.sh

  # Beside `build`, not after it: the crate is source, and the binaries are
  # cross-compiles of it, so neither proves anything the other needs. What
  # proves the crate is `verify / package` — the same packaging, built — which
  # passed before `prepare-release` cut the tag. Waiting on the aarch64 build
  # only made every release that much slower to reach crates.io.
  publish-crate:
    needs: prepare-release
    if: "!cancelled() && !failure() && needs.prepare-release.outputs.release == 'true'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
      - run: rustup toolchain install
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not configured"
            exit 1
          fi
          # `verify / package` already built these exact packages with
          # `cargo publish --dry-run --workspace` before the tag existed. Cargo
          # normally builds each again before uploading; skip that redundant
          # verification on this fresh runner.
          #
          # Each crate has its own version and a release bumps only the ones
          # that changed (release-plz decided which: release-plz.toml), so the rest
          # are already on crates.io at the version they have. Which ones is
          # decided here, from the index, before anything is published —
          # never by reading cargo's "already exists" — so that every real
          # failure (auth, a 429, packaging) still fails the job. The same
          # skip makes a run that failed part-way safe to re-run unchanged.
          #
          # The list comes in dependency order (cctop-core, then -serve and
          # -ui, then cctop), and cargo waits for each to show in the index
          # before the next goes up.
          #
          # An assignment rather than `mapfile < <(...)`, whose exit status
          # bash drops: an index the script could not read must stop here,
          # not read as "nothing left to publish".
          list=$(tools/unpublished-crates.sh)
          if [ -z "$list" ]; then
            echo "::notice::every crate is on crates.io at its version already; nothing to publish"
            exit 0
          fi
          mapfile -t crates <<<"$list"
          echo "publishing: ${crates[*]}"
          cargo publish --locked --no-verify "${crates[@]/#/-p=}"
