# The Rust that builds, lints and releases cctop, here and in CI alike.
#
# CI used to take whatever `stable` was that day while this machine had
# whatever stable was when it last updated. Clippy grows lints with every
# release and CI runs it with `-D warnings`, so the two drifted apart
# silently: a lint new in 1.99 merged clean locally on 1.98 and left main
# failing CI until 0.24.0 fixed it. Pinned, a lint can only arrive in a pull
# request that moves this line — read its clippy output there.
[toolchain]
channel = "1.99"
components = ["clippy", "rustfmt"]
profile = "minimal"

# The cargo-semver-checks that `verify / release-plan` runs on a release
# commit. It reads the rustdoc JSON this toolchain writes, whose format changes
# between Rust releases, and each of its releases understands a range of them —
# so it is pinned here, beside the channel it has to understand, and a pull
# request that moves `channel` may have to move this line too (its release
# notes name the Rust versions each one supports). CI installs the version on
# this line and tools/release-plan.sh refuses any other; the line is read by
# both, so keep its shape.
#
# cargo-semver-checks 0.51.0
